[project]
name = "manim-motion-design"
version = "0.1.0"
description = "Industry-level motion design engine using Manim + Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "manim>=0.18.1",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "edge-tts>=7.2.8",
    "mutagen>=1.47.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "google-auth-httplib2>=0.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["motion_framework"]
